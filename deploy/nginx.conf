server {
    listen 80;
    server_name op-fantasy-bot.branta.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/op-fantasy-bot.branta.dev;
        default_type text/plain;
    }
    location / { return 301 https://op-fantasy-bot.branta.dev$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name op-fantasy-bot.branta.dev;
    ssl_certificate /etc/letsencrypt/live/op-fantasy-bot.branta.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/op-fantasy-bot.branta.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_guildwar:5m;
    ssl_session_timeout 1h;
    client_max_body_size 10m;

    location = /qq/webhook {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
